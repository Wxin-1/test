<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 本地代码助手 - 完整体验版</title>
    <style>
        /* === 主题颜色变量 === */
        :root {
            --bg-color: var(--vscode-editor-background, #1e1e1e);
            --text-color: var(--vscode-editor-foreground, #cccccc);
            --sidebar-bg: var(--vscode-sideBar-background, #252526);
            --sidebar-border: var(--vscode-sideBar-border, #333333);
            --item-hover: var(--vscode-list-hoverBackground, #2a2d2e);
            --item-active-bg: var(--vscode-list-activeSelectionBackground, #37373d);
            --item-active-text: var(--vscode-list-activeSelectionForeground, #ffffff);
            --input-bg: var(--vscode-input-background, #3c3c3c);
            --input-border: var(--vscode-input-border, #3c3c3c);
            --ai-msg-bg: var(--vscode-editorWidget-background, #2d2d2d);
            --ai-msg-border: var(--vscode-widget-border, #454545);
            --btn-bg: var(--vscode-button-background, #0e639c);
            --btn-text: var(--vscode-button-foreground, #ffffff);
            --text-muted: #888888;
        }

        body.theme-light {
            --bg-color: #ffffff;
            --text-color: #333333;
            --sidebar-bg: #f7f7f7;
            --sidebar-border: #e0e0e0;
            --item-hover: #e8e8e8;
            --item-active-bg: #0060c0;
            --item-active-text: #ffffff;
            --input-bg: #ffffff;
            --input-border: #cccccc;
            --ai-msg-bg: #f4f6f8;
            --ai-msg-border: #e2e8f0;
            --btn-bg: #007acc;
            --btn-text: #ffffff;
            --text-muted: #666666;
        }

        body.theme-dark {
            --bg-color: #1e1e1e;
            --text-color: #cccccc;
            --sidebar-bg: #252526;
            --sidebar-border: #333333;
            --item-hover: #2a2d2e;
            --item-active-bg: #37373d;
            --item-active-text: #ffffff;
            --input-bg: #3c3c3c;
            --input-border: #3c3c3c;
            --ai-msg-bg: #2d2d2d;
            --ai-msg-border: #454545;
            --btn-bg: #0e639c;
            --btn-text: #ffffff;
            --text-muted: #888888;
        }

        /* 基础页面设置 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex; 
            height: 100vh;
            box-sizing: border-box;
            background-color: var(--bg-color); 
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }
        
        /* === 左侧边栏 === */
        #sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--sidebar-border);
            display: flex;
            flex-direction: column;
            padding: 15px 10px;
            box-sizing: border-box;
            transition: background-color 0.3s;
        }

        #new-chat-btn {
            padding: 10px;
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--sidebar-border);
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 15px;
            font-size: 14px;
            text-align: left;
            transition: all 0.2s;
        }

        #new-chat-btn:hover { background-color: var(--item-hover); }

        #chat-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex: 1;
        }

        /* 🌟 改动 1：为支持删除按钮，重写 chat-item 的布局 */
        .chat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin-bottom: 5px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-color);
            font-size: 13px;
            transition: background-color 0.2s;
        }

        /* 聊天标题容器，溢出时显示省略号 */
        .chat-title {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis; 
            margin-right: 5px;
        }

        .chat-item:hover { background-color: var(--item-hover); }
        .chat-item.active {
            background-color: var(--item-active-bg);
            color: var(--item-active-text);
        }

        /* 🌟 新增：删除按钮样式，默认透明，悬浮时显示 */
        .delete-btn {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            font-size: 14px;
            padding: 2px 4px;
            border-radius: 4px;
            opacity: 0; 
            transition: opacity 0.2s, background-color 0.2s;
        }

        .chat-item:hover .delete-btn { opacity: 1; }
        .delete-btn:hover { background-color: rgba(255, 0, 0, 0.2); }

        #theme-toggle-btn {
            margin-top: 10px;
            padding: 10px;
            background-color: transparent;
            color: var(--text-muted);
            border: none;
            border-top: 1px solid var(--sidebar-border);
            cursor: pointer;
            text-align: left;
            font-size: 13px;
            border-radius: 0 0 6px 6px;
        }
        #theme-toggle-btn:hover { color: var(--text-color); background-color: var(--item-hover); }

        /* === 右侧主聊天区 === */
        #main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
        }
        
        #chat-container {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            border-radius: 8px;
            padding: 15px;
        }

        .message {
            margin-bottom: 20px;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.6;
            word-wrap: break-word;
            max-width: 80%;
            font-size: 14px;
            white-space: pre-wrap;
        }

        .user-message {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            margin-left: auto; 
            border-bottom-right-radius: 2px;
        }

        .ai-message {
            background-color: var(--ai-msg-bg);
            border: 1px solid var(--ai-msg-border);
            color: var(--text-color);
            margin-right: auto; 
            border-bottom-left-radius: 2px;
            transition: background-color 0.3s;
        }

        /* 多行输入框样式 */
        #input-container {
            display: flex;
            gap: 10px;
            padding: 0 10px;
            align-items: flex-end;
        }

        #user-input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 6px;
            border: 1px solid var(--input-border);
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 14px;
            font-family: inherit; 
            outline: none;
            resize: none; 
            overflow-y: auto;
            max-height: 150px; 
            line-height: 1.5;
            transition: border-color 0.3s, background-color 0.3s;
        }

        #user-input:focus { border-color: var(--btn-bg); }

        #send-btn {
            padding: 12px 24px;
            height: 46px; 
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        #send-btn:hover { opacity: 0.9; }

        /* AI 思考中加载动画样式 */
        .typing-indicator {
            display: flex;
            gap: 5px;
            align-items: center;
            height: 20px;
            padding: 0 5px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <button id="new-chat-btn">➕ 新建对话</button>
        <ul id="chat-list"></ul>
        <button id="theme-toggle-btn">☀️ 切换浅色模式</button>
    </div>

    <div id="main-area">
        <div id="chat-container"></div>
        <div id="input-container">
            <textarea id="user-input" rows="1" placeholder="输入问题 (Enter 发送，Shift+Enter 换行)..."></textarea>
            <button id="send-btn">发送</button>
        </div>
    </div>

    <script>
        const LOCAL_STORAGE_KEY = 'ai_assistant_data';

        // ==========================================
        // 🌟 新增功能 5：本地存储管理
        // ==========================================
        function loadData() {
            const savedData = localStorage.getItem(LOCAL_STORAGE_KEY);
            if (savedData) {
                try {
                    const parsed = JSON.parse(savedData);
                    return parsed;
                } catch (e) {
                    console.error("读取本地数据失败", e);
                }
            }
            return null;
        }

        function saveData() {
            const dataToSave = {
                theme: currentTheme,
                chatId: currentChatId,
                history: chatHistory
            };
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(dataToSave));
        }

        // ==========================================
        // 初始化数据状态
        // ==========================================
        let chatHistory = [];
        let currentChatId = null;
        let currentTheme = 'dark'; 
        let isWaitingForAI = false; 

        // 尝试加载本地数据
        const initialData = loadData();
        if (initialData && initialData.history && initialData.history.length > 0) {
            chatHistory = initialData.history;
            currentChatId = initialData.chatId || chatHistory[0].id;
            currentTheme = initialData.theme || 'dark';
        } else {
            // 没有本地数据，使用默认数据
            chatHistory = [{
                id: Date.now(),
                title: "默认对话",
                messages: [
                    { sender: 'ai', text: "👋 你好！我是你的本地代码助手。<br><br>💡 <b>本次升级新增：</b><br>1. 历史对话现在已经保存到本地啦，刷新页面也不会丢失！<br>2. 鼠标放到左侧列表，试试删除无用的对话。" }
                ]
            }];
            currentChatId = chatHistory[0].id;
        }

        // DOM 元素引用
        const themeToggleBtn = document.getElementById('theme-toggle-btn');
        const chatListEl = document.getElementById('chat-list');
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const newChatBtn = document.getElementById('new-chat-btn');

        // 应用初始主题
        if (currentTheme === 'light') {
            document.body.classList.replace('theme-dark', 'theme-light');
            themeToggleBtn.textContent = '🌙 切换深色模式';
        }

        // 主题切换逻辑
        themeToggleBtn.onclick = () => {
            if (currentTheme === 'dark') {
                document.body.classList.remove('theme-dark');
                document.body.classList.add('theme-light');
                themeToggleBtn.textContent = '🌙 切换深色模式';
                currentTheme = 'light';
            } else {
                document.body.classList.remove('theme-light');
                document.body.classList.add('theme-dark');
                themeToggleBtn.textContent = '☀️ 切换浅色模式';
                currentTheme = 'dark';
            }
            saveData(); // 🌟 保存主题状态
        };

        // ==========================================
        // 界面渲染逻辑
        // ==========================================
        function renderSidebar() {
            chatListEl.innerHTML = ''; 
            chatHistory.forEach(chat => {
                const li = document.createElement('li');
                li.className = 'chat-item';
                if (chat.id === currentChatId) li.classList.add('active'); 
                
                // 🌟 改动 1：拆分标题和删除按钮
                const titleSpan = document.createElement('span');
                titleSpan.className = 'chat-title';
                titleSpan.textContent = chat.title;

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.innerHTML = '🗑️';
                deleteBtn.title = '删除对话';
                
                // 🌟 新增功能 4：删除事件
                deleteBtn.onclick = (e) => {
                    e.stopPropagation(); // 阻止事件冒泡，防止触发 li 的点击切换事件
                    deleteChat(chat.id);
                };

                li.appendChild(titleSpan);
                li.appendChild(deleteBtn);

                li.onclick = () => {
                    currentChatId = chat.id;
                    saveData(); // 🌟 保存当前选中的对话状态
                    renderSidebar(); 
                    renderMessages(); 
                };
                chatListEl.appendChild(li);
            });
        }

        // 🌟 新增功能 4：处理删除逻辑
        function deleteChat(id) {
            chatHistory = chatHistory.filter(c => c.id !== id);

            // 如果删光了，自动建一个新的空对话
            if (chatHistory.length === 0) {
                chatHistory = [{
                    id: Date.now(),
                    title: "新对话",
                    messages: [{ sender: 'ai', text: "所有的对话都被清空啦。请问有什么可以帮您？" }]
                }];
                currentChatId = chatHistory[0].id;
            } 
            // 如果删除了当前正在看的对话，自动切换到列表的第一个
            else if (currentChatId === id) {
                currentChatId = chatHistory[0].id;
            }

            saveData(); // 🌟 删除后立即保存到本地
            renderSidebar();
            renderMessages();
        }

        function renderMessages() {
            chatContainer.innerHTML = ''; 
            const currentChat = chatHistory.find(c => c.id === currentChatId);
            
            if (currentChat) {
                currentChat.messages.forEach(msg => {
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `message ${msg.sender}-message`;
                    msgDiv.innerHTML = msg.text;
                    chatContainer.appendChild(msgDiv);
                });

                if (isWaitingForAI) {
                    const typingDiv = document.createElement('div');
                    typingDiv.className = 'message ai-message';
                    typingDiv.innerHTML = `
                        <div class="typing-indicator">
                            <div class="dot"></div>
                            <div class="dot"></div>
                            <div class="dot"></div>
                        </div>
                    `;
                    chatContainer.appendChild(typingDiv);
                }
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function addMessageAndRender(sender, text) {
            const currentChat = chatHistory.find(c => c.id === currentChatId);
            if (currentChat) {
                currentChat.messages.push({ sender, text });
                // 如果是用户发的首条消息，自动修改标题
                if (sender === 'user' && currentChat.messages.length === 2) {
                    currentChat.title = text.substring(0, 12) + (text.length > 12 ? '...' : '');
                    renderSidebar();
                }
                saveData(); // 🌟 有新消息时保存
                renderMessages();
            }
        }

        newChatBtn.onclick = () => {
            const newChat = {
                id: Date.now(),
                title: "新对话",
                messages: [{ sender: 'ai', text: "开启了一个新对话，请问有什么可以帮您？" }]
            };
            chatHistory.unshift(newChat); 
            currentChatId = newChat.id;   
            saveData(); // 🌟 新建对话后保存
            renderSidebar();
            renderMessages();
            userInput.focus();
        };

        // ==========================================
        // 输入区与发送逻辑
        // ==========================================
        userInput.addEventListener('input', function() {
            this.style.height = 'auto'; 
            this.style.height = (this.scrollHeight) + 'px'; 
            if(this.value === '') this.style.height = 'auto'; 
        });

        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault(); 
                sendMessage();      
            }
        });

        let vscode;
        if (typeof acquireVsCodeApi === 'function') {
            vscode = acquireVsCodeApi();
        } else {
            vscode = {
                postMessage: function(message) {
                    if (message.command === 'chat') {
                        const targetChatId = currentChatId; 
                        
                        setTimeout(() => {
                            const mockReply = "🤖 <b>AI 回复：</b><br>我收到你的消息了！如果你刷新页面，你会发现我们的对话记录依然存在。<br>你说：<br><code>" + message.text + "</code>";
                            const targetChat = chatHistory.find(c => c.id === targetChatId);
                            if (targetChat) {
                                isWaitingForAI = false; 
                                targetChat.messages.push({ sender: 'ai', text: mockReply });
                                saveData(); // 🌟 收到 AI 回复后保存
                                if (currentChatId === targetChatId) {
                                    renderMessages();
                                }
                            }
                        }, 1200); 
                    }
                }
            };
        }

        function sendMessage() {
            const text = userInput.value.trim();
            if (!text || isWaitingForAI) return; 

            addMessageAndRender('user', text);
            
            userInput.value = '';
            userInput.style.height = 'auto';
            userInput.focus();

            isWaitingForAI = true;
            renderMessages();

            vscode.postMessage({ command: 'chat', text: text });
        }

        sendBtn.addEventListener('click', sendMessage);

        window.addEventListener('message', event => {
            const message = event.data;
            if (message && message.command === 'receiveMessage') {
                isWaitingForAI = false; 
                addMessageAndRender('ai', message.text); 
                saveData(); // 🌟 收到真实数据后保存
            }
        });

        // 初始化渲染
        renderSidebar();
        renderMessages();
    </script>
</body>
</html>
